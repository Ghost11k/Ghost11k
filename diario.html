<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  let datos = { diario: [] };
  let usuarioId = null;

  async function init(){
    const session = await checkUser();
    if(session) {
      usuarioId = session.user.id;
      await cargarDiario();
      document.body.insertAdjacentHTML('beforeend', bottomNavHTML('diario'));
    }
  }

  async function cargarDiario(){
    // 1. Pedir los datos a Supabase
    const { data, error } = await supabase
      .from('diario')
      .select('*')
      .order('fecha', { ascending: false });

    if(error) {
      console.error('Error al cargar:', error);
      return;
    }
    datos.diario = data;
    render();
  }

  document.getElementById('d-guardar').addEventListener('click', async () => {
    const fecha = document.getElementById('d-fecha').value || hoy();
    const titulo = document.getElementById('d-titulo').value.trim();
    const texto = document.getElementById('d-texto').value.trim();
    
    if(!titulo && !texto){ alert('Escribe algo.'); return; }

    // 2. Guardar en Supabase
    const { error } = await supabase
      .from('diario')
      .insert([{ 
        fecha: fecha, 
        titulo: titulo || '(Sin título)', 
        texto: texto,
        user_id: usuarioId 
      }]);

    if(error) {
      alert('Error al guardar: ' + error.message);
    } else {
      document.getElementById('d-titulo').value = '';
      document.getElementById('d-texto').value = '';
      await cargarDiario(); // Recargar la lista
    }
  });

  function render(){
    const $l = document.getElementById('lista-diario');
    if(!datos.diario.length){ $l.innerHTML = '<p class="vacio">Sin entradas todavía.</p>'; return; }
    
    $l.innerHTML = datos.diario.map(e => `
      <div class="entrada">
        <div class="entrada-head">
          <span class="fecha">${fechaBonita(e.fecha)}</span>
          <button class="btn danger" onclick="borrarEntrada(${e.id})">Eliminar</button>
        </div>
        <h3>${esc(e.titulo)}</h3>
        <p>${esc(e.texto)}</p>
      </div>`).join('');
  }

  // 3. Borrar de Supabase
  window.borrarEntrada = async (id) => {
    if(!confirm('¿Eliminar?')) return;
    const { error } = await supabase.from('diario').delete().eq('id', id);
    if(error) alert('Error al borrar');
    else await cargarDiario();
  };

  init();
</script>
</body>
</html>
