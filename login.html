<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="contenedor" style="max-width:400px; margin-top:10vh;">
  <div class="panel-head">
    <h1>Acceso</h1>
    <div class="tag">Identifícate para ver tus datos</div>
  </div>

  <div class="block">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="tu@correo.com" style="margin-bottom:10px">
    
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="********" style="margin-bottom:15px">
    
    <button class="btn green" id="btn-login" style="width:100%; margin-bottom:10px;">Entrar</button>
    <button class="btn ghost" id="btn-register" style="width:100%;">Crear cuenta nueva</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  // Verificar si ya está logueado al entrar a esta página
  checkUser();

  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) alert('Error al entrar: ' + error.message);
    else window.location.href = 'index.html';
  });

  document.getElementById('btn-register').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await supabase.auth.signUp({ email, password });
    if(error) alert('Error al registrar: ' + error.message);
    else alert('Cuenta creada. Ya puedes entrar (si desactivaste la confirmación de email, entra directamente).');
  });
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  // Verificamos si ya está logueado (esto lo redirige al index si es así)
  checkUser();

  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if(!email || !password) return alert('Rellena correo y contraseña');
    
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) alert('Error al entrar: ' + error.message);
    else window.location.href = 'index.html';
  });

  document.getElementById('btn-register').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if(!email || !password) return alert('Rellena correo y contraseña');
    
    const { error } = await supabase.auth.signUp({ email, password });
    if(error) alert('Error al registrar: ' + error.message);
    else alert('Cuenta creada. Ya puedes entrar.');
  });
</script>
</body>
</html>
