<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hábitos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- PANTALLA DE CARGA -->
<div id="loader" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#ede8dc; z-index:9999; display:flex; align-items:center; justify-content:center; font-family:monospace; font-weight:bold; color:#2a2825;">
  Cargando hábitos...
</div>

<main class="contenedor">
  <div class="panel-head">
    <h1>Hábitos</h1>
    <div class="tag">Constancia diaria</div>
  </div>

  <div class="block">
    <div class="section-head">
      <span class="section-num">01</span>
      <h2 class="section-title">Añadir hábito</h2>
    </div>
    <form class="add-form" id="form-habito">
      <input type="text" id="h-nombre" placeholder="Ej: Leer 20 minutos, Beber 2L de agua...">
      <button class="btn green" type="submit">Añadir</button>
    </form>
    <p class="note">Pulsa cada día para marcarlo. Desliza si hay muchos días.</p>
  </div>

  <div class="block">
    <div class="section-head">
      <span class="section-num">02</span>
      <h2 class="section-title">Mis hábitos</h2>
    </div>
    <div id="lista-habitos"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  let datos = { habitos: [] };
  let usuarioId = null;

  // 1. ARRANQUE Y SEGURIDAD
  async function init(){
    // 1.1 Insertar menú inferior inmediatamente para que no parpadee
    document.body.insertAdjacentHTML('beforeend', bottomNavHTML('habitos'));

    // 1.2 Comprobar sesión
    const session = await checkUser();
    
    if(session) {
      usuarioId = session.user.id;
      await cargarHabitos();
    } else {
      // Si no hay sesión, checkUser ya te habrá redirigido al login.
      return; 
    }
    
    // 1.3 Ocultar pantalla de carga
    document.getElementById('loader').style.display = 'none';
  }

  // 2. CARGAR DATOS DE SUPABASE
  async function cargarHabitos(){
    const { data, error } = await supabaseClient
      .from('habitos')
      .select('*')
      .order('created_at', { ascending: true });

    if(error) {
      console.error('Error al cargar:', error);
      alert('Error al cargar los hábitos: ' + error.message);
      return;
    }
    datos.habitos = data || [];
    render();
  }

  // 3. AÑADIR HÁBITO A SUPABASE
  document.getElementById('form-habito').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if(!usuarioId) {
      alert("Error crítico: No se ha detectado tu sesión de usuario. Recarga la página e intenta entrar de nuevo.");
      return;
    }

    const input = document.getElementById('h-nombre');
    const nombre = input.value.trim();
    if(!nombre) return;

    // Deshabilitar botón temporalmente para evitar doble clic
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    btn.innerText = '...';

    const { error } = await supabaseClient
      .from('habitos')
      .insert([{ 
        nombre: nombre, 
        dias: {}, 
        user_id: usuarioId 
      }]);

    btn.disabled = false;
    btn.innerText = 'Añadir';

    if(error) {
      console.error("Error de Supabase al insertar:", error);
      alert('Error al guardar: ' + error.message);
    } else {
      input.value = '';
      await cargarHabitos(); // Recargar la lista desde la nube
    }
  });

  // 4. RENDERIZAR EN PANTALLA
  function racha(h){
    let n = 0;
    const d = new Date();
    // Si hoy no está marcado, empezamos a contar desde ayer
    if(!h.dias || !h.dias[iso(d)]) d.setDate(d.getDate() - 1);
    
    while(h.dias && h.dias[iso(d)]){ 
      n++; 
      d.setDate(d.getDate() - 1); 
    }
    return n;
  }

  function render(){
    const $l = document.getElementById('lista-habitos');
    if(!datos.habitos.length){ 
      $l.innerHTML = '<p class="vacio">Sin hábitos todavía. Añade el primero arriba.</p>'; 
      return; 
    }

    const dias = [];
    for(let i = CONFIG.diasHabitos - 1; i >= 0; i--){
      const d = new Date(); d.setDate(d.getDate() - i); dias.push(d);
    }

    $l.innerHTML = datos.habitos.map(h => {
      // Aseguramos que 'h.dias' existe
      const diasHabito = h.dias || {};

      const celdas = dias.map(d => {
        const f = iso(d);
        const hecho = !!diasHabito[f];
        const esHoy = f === hoy();
        return `<button class="dia ${hecho ? 'hecho' : ''} ${esHoy ? 'hoy' : ''}"
                  data-habito="${h.id}" data-fecha="${f}" title="${fechaBonita(f)}">
                  <span class="letra">${LETRAS_DIA[d.getDay()]}</span>
                  <span class="num">${d.getDate()}</span>
                </button>`;
      }).join('');

      return `<div class="habito">
        <span class="nombre">${esc(h.nombre)}</span>
        <div class="semana">${celdas}</div>
        <span class="racha">🔥 ${racha(h)} d</span>
        <button class="btn danger" data-del="${h.id}">✕</button>
      </div>`;
    }).join('');

    // Eventos para marcar/desmarcar días
    $l.querySelectorAll('[data-habito]').forEach(b => {
      b.addEventListener('click', async () => {
        const h = datos.habitos.find(x => x.id === b.dataset.habito);
        if(!h) return;
        
        const f = b.dataset.fecha;
        const nuevosDias = { ...(h.dias || {}) }; // Copiamos el objeto o creamos uno nuevo
        
        if(nuevosDias[f]) delete nuevosDias[f]; 
        else nuevosDias[f] = true;

        // Actualizar en Supabase
        const { error } = await supabaseClient
          .from('habitos')
          .update({ dias: nuevosDias })
          .eq('id', h.id);

        if(error) {
          alert('Error al actualizar: ' + error.message);
        } else {
          h.dias = nuevosDias; // Actualizar en memoria
          render(); // Volver a pintar
        }
      });
    });

    // Eventos para borrar hábito
    $l.querySelectorAll('[data-del]').forEach(b => {
      b.addEventListener('click', async () => {
        if(!confirm('¿Eliminar este hábito y todo su historial?')) return;
        
        const { error } = await supabaseClient
          .from('habitos')
          .delete()
          .eq('id', b.dataset.del);

        if(error) alert('Error al borrar: ' + error.message);
        else await cargarHabitos();
      });
    });
  }

  // Iniciar todo
  init();
</script>
</body>
</html>
