<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hábitos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="contenedor">
  <div class="panel-head">
    <h1>Hábitos</h1>
    <div class="tag">Constancia diaria</div>
  </div>

  <div class="block">
    <div class="section-head">
      <span class="section-num">01</span>
      <h2 class="section-title">Añadir hábito</h2>
    </div>
    <form class="add-form" id="form-habito">
      <input type="text" id="h-nombre" placeholder="Ej: Leer 20 minutos, Beber 2L de agua...">
      <button class="btn green" type="submit">Añadir</button>
    </form>
    <p class="note">Pulsa cada día para marcarlo. Desliza si hay muchos días.</p>
  </div>

  <div class="block">
    <div class="section-head">
      <span class="section-num">02</span>
      <h2 class="section-title">Mis hábitos</h2>
    </div>
    <div id="lista-habitos"></div>
  </div>
</main>

<script src="app.js"></script>
<script>
let datos = cargar();

document.getElementById('form-habito').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('h-nombre');
  const nombre = input.value.trim();
  if(!nombre) return;
  datos.habitos.push({ id: uid(), nombre, dias: {} });
  guardar(datos);
  input.value = '';
  render();
});

function racha(h){
  let n = 0;
  const d = new Date();
  if(!h.dias[iso(d)]) d.setDate(d.getDate() - 1);
  while(h.dias[iso(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function render(){
  const $l = document.getElementById('lista-habitos');
  if(!datos.habitos.length){ $l.innerHTML = '<p class="vacio">Sin hábitos todavía.</p>'; return; }
  const dias = [];
  for(let i = CONFIG.diasHabitos - 1; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i); dias.push(d);
  }
  $l.innerHTML = datos.habitos.map(h => {
    const celdas = dias.map(d => {
      const f = iso(d);
      const hecho = !!h.dias[f];
      const esHoy = f === hoy();
      return `<button class="dia ${hecho ? 'hecho' : ''} ${esHoy ? 'hoy' : ''}"
                data-habito="${h.id}" data-fecha="${f}" title="${fechaBonita(f)}">
                <span class="letra">${LETRAS_DIA[d.getDay()]}</span>
                <span class="num">${d.getDate()}</span>
              </button>`;
    }).join('');
    return `<div class="habito">
      <span class="nombre">${esc(h.nombre)}</span>
      <div class="semana">${celdas}</div>
      <span class="racha">🔥 ${racha(h)} d</span>
      <button class="btn danger" data-del="${h.id}">✕</button>
    </div>`;
  }).join('');
  $l.querySelectorAll('[data-habito]').forEach(b => {
    b.addEventListener('click', () => {
      const h = datos.habitos.find(x => x.id === b.dataset.habito);
      if(!h) return;
      const f = b.dataset.fecha;
      if(h.dias[f]) delete h.dias[f]; else h.dias[f] = true;
      guardar(datos); render();
    });
  });
  $l.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', () => {
      if(!confirm('¿Eliminar hábito?')) return;
      datos.habitos = datos.habitos.filter(x => x.id !== b.dataset.del);
      guardar(datos); render();
    });
  });
}

document.body.insertAdjacentHTML('beforeend', bottomNavHTML('habitos'));
mountBackupBar(document.querySelector('.contenedor'), () => location.reload());
render();
</script>
</body>
</html>
