<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · Mi Organización</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Estilos específicos para que el login quede centrado */
  .login-container {
    max-width: 400px;
    margin: 15vh auto;
  }
  .login-box {
    background: var(--cement);
    border: 2px solid var(--line);
    box-shadow: 6px 6px 0 var(--shadow);
    padding: 30px;
  }
  .login-box input { margin-bottom: 15px; }
  .login-box button { width: 100%; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="login-container">
  <div class="panel-head">
    <h1>Acceso</h1>
    <div class="tag">Identifícate para ver tus datos</div>
  </div>

  <div class="login-box">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="tu@correo.com" autocomplete="username">
    
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="********" autocomplete="current-password">
    
    <button class="btn green" id="btn-login">Entrar</button>
  </div>
</div>

<!-- CDN de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Nuestro archivo con la lógica y credenciales -->
<script src="app.js"></script>

<script>
  // 1. Verificar si ya hay sesión activa al entrar a la página
  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      window.location.href = 'habitos.html'; // Si ya está logueado, a Hábitos
    }
  });

  // 2. Lógica del botón Entrar
  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');
    
    if(!email || !password) return alert('Por favor, rellena todos los campos.');
    
    btn.innerText = 'Entrando...';
    btn.disabled = true;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    
    btn.innerText = 'Entrar';
    btn.disabled = false;

    if(error) {
      console.error(error);
      alert('Error: Correo o contraseña incorrectos.');
    } else {
      // Éxito: Redirigimos a Hábitos
      window.location.href = 'habitos.html';
    }
  });

  // 3. Permitir pulsar 'Enter' en el teclado para iniciar sesión
  document.getElementById('password').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      document.getElementById('btn-login').click();
    }
  });
</script>
</body>
</html>
