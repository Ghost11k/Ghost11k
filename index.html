<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · Mi Organización</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Estilos específicos para que el login quede centrado y bonito */
  .login-container {
    max-width: 400px;
    margin: 15vh auto;
  }
  .login-box {
    background: var(--cement);
    border: 2px solid var(--line);
    box-shadow: 6px 6px 0 var(--shadow);
    padding: 30px;
  }
  .login-box input { margin-bottom: 15px; }
  .login-box button { width: 100%; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="login-container">
  <div class="panel-head">
    <h1>Acceso</h1>
    <div class="tag">Identifícate para ver tus datos</div>
  </div>

  <div class="login-box">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="tu@correo.com">
    
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="********">
    
    <button class="btn green" id="btn-login">Entrar</button>
    <button class="btn ghost" id="btn-register">Crear cuenta nueva</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  // Si ya hay una sesión activa, saltamos directo a Hábitos
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      window.location.href = 'habitos.html';
    }
  });

  // Lógica de Iniciar Sesión
  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if(!email || !password) return alert('Rellena todos los campos');
    
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) {
      alert('Error al entrar: ' + error.message);
    } else {
      window.location.href = 'habitos.html'; // Al entrar, vamos a Hábitos
    }
  });

  // Lógica de Registro
  document.getElementById('btn-register').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if(!email || !password) return alert('Rellena todos los campos');
    
    const { error } = await supabase.auth.signUp({ email, password });
    if(error) {
      alert('Error al registrar: ' + error.message);
    } else {
      alert('Cuenta creada con éxito. Pulsa "Entrar" para acceder.');
    }
  });
</script>
</body>
</html>
