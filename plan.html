<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Quinquenal</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Estilos del Plan (Brutalista) */
  .panel-head { border-bottom: 3px solid var(--line); padding-bottom: 18px; margin-bottom: 24px; position: relative; }
  .panel-head h1 { font-size: 38px; letter-spacing: -0.03em; line-height: 1; margin-bottom: 6px; font-family: Georgia, serif; }
  .panel-head .tag { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  
  .plan-map { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; background: var(--bg); border: 2px solid var(--line); margin-bottom: 20px; flex-wrap: wrap; }
  .plan-map .node { padding: 8px 12px; border: 2px solid var(--line); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-align: center; background: var(--cement); min-width: 76px; }
  .plan-map .node span { display: block; font-size: 9px; color: var(--muted); margin-top: 2px; font-weight: 500; }
  .plan-map .arrow { font-size: 14px; color: var(--terra); font-weight: 700; }
  @media (max-width: 640px) { .plan-map .arrow { transform: rotate(90deg); } }

  .block { background: var(--cement); border: 2px solid var(--line); box-shadow: 6px 6px 0 var(--shadow); padding: 20px; margin-bottom: 20px; position: relative; }
  .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
  .section-num { font-size: 11px; letter-spacing: 0.15em; color: var(--terra); font-weight: 700; }
  .section-title { font-family: Georgia, serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; flex: 1; }
  
  .vision-textarea { font-family: Georgia, serif; font-size: 18px; line-height: 1.65; font-style: italic; min-height: 140px; padding: 20px; background: var(--bg); border: 2px solid var(--line); color: var(--ink); width: 100%; }

  .parent-filter { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 12px; background: var(--bg); border: 2px dashed var(--line); flex-wrap: wrap; }
  .parent-filter label { margin: 0; color: var(--terra); font-size: 10px; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
  .parent-filter select { flex: 1; min-width: 200px; border: 2px solid var(--line); padding: 8px; background: var(--bg); color: var(--ink); font-family: inherit; font-weight: bold; }

  .lista { display: flex; flex-direction: column; gap: 10px; }
  .obj { padding: 14px 14px 14px 18px; background: var(--bg); border: 2px solid var(--line); position: relative; overflow: hidden; }
  .obj::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--terra); }
  .obj.hecho::before { background: var(--green); }
  .obj.hecho h3 { text-decoration: line-through; opacity: 0.6; }
  .obj-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .obj-head .periodo { font-size: 10px; letter-spacing: 0.15em; color: var(--terra); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
  .obj h3 { font-size: 16px; margin-bottom: 4px; font-family: Georgia, serif; }
  
  .barra { height: 12px; background: var(--bg-2, #d4cbb8); border: 2px solid var(--line); overflow: hidden; margin-top: 6px; }
  .barra span { display: block; height: 100%; background: var(--green); transition: width 0.3s; }
  .prog-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .prog-controls input[type="range"] { flex: 1; padding: 0; border: none; background: transparent; accent-color: var(--green); }
  .prog-controls .pct { font-size: 11px; font-weight: 700; min-width: 40px; text-align: right; letter-spacing: 0.05em; }
  .prog-controls.auto { font-size: 11px; color: var(--muted); font-style: italic; padding: 4px 0; }
  
  .vacio { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 0; font-style: italic; font-family: Georgia, serif; }
</style>
</head>
<body>

<!-- PANTALLA DE CARGA INTELIGENTE -->
<div id="loader" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#ede8dc; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:monospace; font-weight:bold; color:#2a2825;">
  <div id="loader-text">Conectando con el Plan...</div>
</div>

<main class="contenedor">
  <div class="panel-head">
    <h1>Plan Quinquenal</h1>
    <div class="tag">Mapa de vida · Visión a 5 años</div>
  </div>

  <div class="plan-map">
    <div class="node">VISIÓN<span>5 años</span></div>
    <div class="arrow">↓</div>
    <div class="node">ANUAL<span>1 año</span></div>
    <div class="arrow">↓</div>
    <div class="node">TRIMESTRE<span>3 meses</span></div>
    <div class="arrow">↓</div>
    <div class="node">MES<span>1 mes</span></div>
    <div class="arrow">↓</div>
    <div class="node">SEMANA<span>7 días</span></div>
  </div>

  <!-- 01 / VISIÓN -->
  <div class="block">
    <div class="section-head">
      <span class="section-num">01</span>
      <h2 class="section-title">Visión a 5 años</h2>
    </div>
    <label for="p-vision" style="font-size:10px; font-weight:bold; text-transform:uppercase; color:var(--muted); margin-bottom:4px; display:block;">El destino</label>
    <textarea id="p-vision" class="vision-textarea" placeholder="¿Dónde quieres estar en 5 años? Escribe sin filtros..."></textarea>
    <div style="margin-top:12px;text-align:right">
      <button class="btn green" id="p-vision-save">Guardar visión</button>
    </div>
  </div>

  <!-- 02 / ANUAL -->
  <div class="block">
    <div class="section-head">
      <span class="section-num">02</span>
      <h2 class="section-title">Objetivos a 1 año</h2>
    </div>
    <form class="add-form" id="form-anual" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <input type="text" id="anual-titulo" placeholder="Título del objetivo anual" style="flex:2; min-width:200px; border:2px solid var(--line); padding:10px; background:var(--bg); color:var(--ink);">
      <input type="text" id="anual-periodo" placeholder="Año" value="2026" style="flex:1; max-width:100px; border:2px solid var(--line); padding:10px; background:var(--bg); color:var(--ink);">
      <button class="btn terra" type="submit" style="background:var(--terra); color:white; box-shadow:3px 3px 0 var(--shadow); cursor:pointer;">Añadir</button>
    </form>
    <div class="lista" data-lista="anual"></div>
  </div>

  <!-- 03 / TRIMESTRAL -->
  <div class="block">
    <div class="section-head">
      <span class="section-num">03</span>
      <h2 class="section-title">Objetivos a 3 meses</h2>
    </div>
    <div class="parent-filter">
      <label>Bajo el anual:</label>
      <select id="sel-anual"></select>
    </div>
    <form class="add-form" id="form-trim" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <input type="text" id="trim-titulo" placeholder="Título del objetivo trimestral" style="flex:2; min-width:200px; border:2px solid var(--line); padding:10px; background:var(--bg); color:var(--ink);">
      <select id="trim-periodo" style="flex:1; max-width:120px; border:2px solid var(--line); padding:10px; background:var(--bg); color:var(--ink);">
        <option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option>
      </select>
      <button class="btn terra" type="submit" style="background:var(--terra); color:white; box-shadow:3px 3px 0 var(--shadow); cursor:pointer;">Añadir</button>
    </form>
    <div class="lista" data-lista="trimestral"></div>
  </div>

  <!-- 04 / MENSUAL -->
  <div class="block">
    <div class="section-head">
      <span class="section-num">04</span>
      <h2 class="section-title">Objetivos a 1 mes</h2>
    </div>
    <div class="parent-filter">
      <label>Bajo el trimestral:</label>
      <select id="sel-trim"></select>
    </div>
    <form class="add-form" id="form-mes" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <input type="text" id="mes-titulo" placeholder="Título del objetivo mensual" style="flex:2; min-width:200px; border:2px solid var(--line); padding:10px; background:var(--bg); color:var(--ink);">
      <select id="mes-periodo" style="flex:1; max-width:140px; border:2px solid var(--line); padding:10px; background:var(--bg); color:var(--ink);">
        <option>Enero</option><option>Febrero</option><option>Marzo</option><option>Abril</option><option>Mayo</option><option>Junio</option>
        <option>Julio</option><option>Agosto</option><option>Septiembre</option><option>Octubre</option><option>Noviembre</option><option>Diciembre</option>
      </select>
      <button class="btn terra" type="submit" style="background:var(--terra); color:white; box-shadow:3px 3px 0 var(--shadow); cursor:pointer;">Añadir</button>
    </form>
    <div class="lista" data-lista="mensual"></div>
  </div>

  <!-- 05 / SEMANAL -->
  <div class="block">
    <div class="section-head">
      <span class="section-num">05</span>
      <h2 class="section-title">Objetivos semanales</h2>
    </div>
    <div class="parent-filter">
      <label>Bajo el mensual:</label>
      <select id="sel-mes"></select>
    </div>
    <form class="add-form" id="form-sem" style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <input type="text" id="sem-titulo" placeholder="Título del objetivo semanal" style="flex:2; min-width:200px; border:2px solid var(--line); padding:10px; background:var(--bg); color:var(--ink);">
      <select id="sem-periodo" style="flex:1; max-width:130px; border:2px solid var(--line); padding:10px; background:var(--bg); color:var(--ink);">
        <option>Semana 1</option><option>Semana 2</option><option>Semana 3</option><option>Semana 4</option>
      </select>
      <button class="btn terra" type="submit" style="background:var(--terra); color:white; box-shadow:3px 3px 0 var(--shadow); cursor:pointer;">Añadir</button>
    </form>
    <div class="lista" data-lista="semanal"></div>
  </div>
</main>

<script>
  // CAPTURADOR DE ERRORES GLOBAL (Muestra errores en pantalla)
  window.onerror = function(msg, url, lineNo, columnNo, error) {
    const loader = document.getElementById('loader');
    if(loader && loader.style.display !== 'none') {
      loader.innerHTML = `<div style="color:#a8563c; text-align:center; padding:20px; max-width:600px;">
        <strong style="font-size:16px;">Error de Script</strong><br><br>
        <span style="font-size:13px; font-family:monospace;">${msg} (Línea ${lineNo})</span><br><br>
        <button onclick="location.reload()" style="padding:10px; font-weight:bold; cursor:pointer; border:2px solid #a8563c; background:transparent; color:#a8563c;">Reintentar</button>
      </div>`;
    }
    return false;
  };
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  let usuarioId = null;
  let objetivos = [];
  const planUI = { anual: null, trim: null, mes: null };

  async function init() {
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    
    try {
      document.body.insertAdjacentHTML('beforeend', bottomNavHTML('plan'));
      
      loaderText.innerText = "Verificando usuario...";
      
      // Añadimos un límite de tiempo de 5 segundos a la comprobación de sesión
      const session = await Promise.race([
        checkUser(),
        new Promise((_, reject) => setTimeout(() => reject(new Error("La conexión con Supabase ha tardado demasiado.")), 5000))
      ]);

      if (!session) {
        loader.style.display = 'none';
        return; // checkUser() ya te habrá redirigido al login
      }
      
      usuarioId = session.user.id;
      
      loaderText.innerText = "Cargando tus objetivos...";
      await cargarDatos();
      
      // Si llegamos aquí sin errores, ocultamos el cargador
      loader.style.display = 'none';
      
    } catch (err) {
      console.error(err);
      loader.innerHTML = `<div style="color:#a8563c; text-align:center; padding:20px; max-width:600px;">
        <strong style="font-size:16px;">Error al cargar el plan</strong><br><br>
        <span style="font-size:13px; font-family:monospace;">${err.message}</span><br><br>
        <p style="font-size:12px; margin-bottom:15px;">Revisa que hayas ejecutado el código SQL en Supabase para crear las tablas 'objetivos' y 'configuracion'.</p>
        <button onclick="location.reload()" style="padding:10px; font-weight:bold; cursor:pointer; border:2px solid #a8563c; background:transparent; color:#a8563c;">Reintentar</button>
      </div>`;
    }
  }

  async function cargarDatos() {
    // 1. Cargar visión
    const resConfig = await supabaseClient.from('configuracion').select('*').eq('user_id', usuarioId).maybeSingle();
    if(resConfig.error) throw new Error("Fallo al leer 'configuracion': " + resConfig.error.message);
    if(resConfig.data && resConfig.data.vision) {
      document.getElementById('p-vision').value = resConfig.data.vision;
    }

    // 2. Cargar objetivos
    const resObjs = await supabaseClient.from('objetivos').select('*').order('id', { ascending: true });
    if(resObjs.error) throw new Error("Fallo al leer 'objetivos': " + resObjs.error.message);
    
    objetivos = resObjs.data || [];
    renderPlan();
  }

  // ==========================================
  // LÓGICA DE RENDERIZADO
  // ==========================================
  function renderPlan() {
    renderListaNivel(1, null, 'anual');
    renderSelectorAnual();
    
    if (planUI.anual) renderListaNivel(2, planUI.anual, 'trimestral');
    else mostrarVacio('trimestral', 'Selecciona primero un objetivo anual.');
    
    renderSelectorTrim();
    
    if (planUI.trim) renderListaNivel(3, planUI.trim, 'mensual');
    else mostrarVacio('mensual', 'Selecciona primero un objetivo trimestral.');
    
    renderSelectorMes();
    
    if (planUI.mes) renderListaNivel(4, planUI.mes, 'semanal');
    else mostrarVacio('semanal', 'Selecciona primero un objetivo mensual.');
  }

  function mostrarVacio(listaId, mensaje) {
    const $l = document.querySelector(`[data-lista="${listaId}"]`);
    if ($l) $l.innerHTML = `<p class="vacio">${mensaje}</p>`;
  }

  function nivelProgress(o) {
    const hijos = objetivos.filter(h => h.parent_id === o.id);
    if (hijos.length > 0) {
      if (o.nivel === 4) {
        const hechos = hijos.filter(h => h.hecho).length;
        return Math.round((hechos / hijos.length) * 100);
      }
      const sum = hijos.reduce((acc, h) => acc + nivelProgress(h), 0);
      return Math.round(sum / hijos.length);
    }
    return o.progreso || 0;
  }

  function renderListaNivel(nivel, parentId, listaId) {
    const $l = document.querySelector(`[data-lista="${listaId}"]`);
    if (!$l) return;

    const items = objetivos.filter(o => o.nivel === nivel && (o.parent_id === parentId || (!o.parent_id && !parentId)));

    if (!items.length) {
      $l.innerHTML = '<p class="vacio">Sin objetivos todavía.</p>';
      return;
    }

    $l.innerHTML = items.map(o => renderObjetivoHTML(o)).join('');

    // Listeners
    $l.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => eliminarObjetivo(b.dataset.del)));
    $l.querySelectorAll('[data-progreso]').forEach(el => {
      el.addEventListener('change', () => actualizarProgreso(el.dataset.progreso, el.value));
    });
    $l.querySelectorAll('[data-toggle-hecho]').forEach(b => {
      b.addEventListener('click', () => toggleHecho(b.dataset.toggleHecho));
    });
  }

  function renderObjetivoHTML(o) {
    const esSemanal = o.nivel === 4;
    const tieneHijos = objetivos.some(h => h.parent_id === o.id);
    const prog = nivelProgress(o);

    const head = `
      <div class="obj-head">
        <div style="flex:1;min-width:0">
          <div class="periodo">${o.periodo || ''}</div>
          <h3>${o.titulo}</h3>
          ${o.descripcion ? `<p style="font-size:12px; color:var(--muted);">${o.descripcion}</p>` : ''}
        </div>
        <button class="btn danger" data-del="${o.id}" style="background:transparent; border:1px solid var(--terra); color:var(--terra); padding:4px 8px; cursor:pointer;">✕</button>
      </div>
    `;

    if (esSemanal) {
      return `
        <div class="obj ${o.hecho ? 'hecho' : ''}">
          ${head}
          <button class="btn ${o.hecho ? 'green' : ''}" data-toggle-hecho="${o.id}" style="background:${o.hecho ? 'var(--green)' : 'transparent'}; color:${o.hecho ? 'white' : 'var(--ink)'}; border:2px solid var(--line); padding:6px 12px; font-weight:bold; cursor:pointer;">
            ${o.hecho ? '✓ Completado' : 'Marcar como hecho'}
          </button>
        </div>
      `;
    }

    const progresoUI = tieneHijos
      ? `<div class="prog-controls auto">Auto · ${prog}% (${objetivos.filter(h => h.parent_id === o.id).length} sub-objetivos)</div>`
      : `<div class="prog-controls">
           <input type="range" min="0" max="100" step="5" value="${o.progreso || 0}" data-progreso="${o.id}">
           <span class="pct">${prog}%</span>
         </div>`;

    return `
      <div class="obj ${prog >= 100 ? 'hecho' : ''}">
        ${head}
        <div class="barra"><span style="width:${prog}%"></span></div>
        ${progresoUI}
      </div>
    `;
  }

  function renderSelectorAnual() {
    const sel = document.getElementById('sel-anual');
    const anuales = objetivos.filter(o => o.nivel === 1);
    if (!anuales.length) {
      sel.innerHTML = '<option value="">— sin objetivos anuales —</option>';
      sel.disabled = true; planUI.anual = null; return;
    }
    sel.disabled = false;
    sel.innerHTML = anuales.map(a => `<option value="${a.id}">${a.periodo} · ${a.titulo}</option>`).join('');
    if (!planUI.anual || !anuales.find(a => a.id == planUI.anual)) planUI.anual = anuales[0].id;
    sel.value = planUI.anual;
  }

  function renderSelectorTrim() {
    const sel = document.getElementById('sel-trim');
    const trims = objetivos.filter(o => o.nivel === 2 && o.parent_id == planUI.anual);
    if (!trims.length) {
      sel.innerHTML = '<option value="">— sin objetivos trimestrales —</option>';
      sel.disabled = true; planUI.trim = null; return;
    }
    sel.disabled = false;
    sel.innerHTML = trims.map(t => `<option value="${t.id}">${t.periodo} · ${t.titulo}</option>`).join('');
    if (!planUI.trim || !trims.find(t => t.id == planUI.trim)) planUI.trim = trims[0].id;
    sel.value = planUI.trim;
  }

  function renderSelectorMes() {
    const sel = document.getElementById('sel-mes');
    const meses = objetivos.filter(o => o.nivel === 3 && o.parent_id == planUI.trim);
    if (!meses.length) {
      sel.innerHTML = '<option value="">— sin objetivos mensuales —</option>';
      sel.disabled = true; planUI.mes = null; return;
    }
    sel.disabled = false;
    sel.innerHTML = meses.map(m => `<option value="${m.id}">${m.periodo} · ${m.titulo}</option>`).join('');
    if (!planUI.mes || !meses.find(m => m.id == planUI.mes)) planUI.mes = meses[0].id;
    sel.value = planUI.mes;
  }

  // ==========================================
  // ACCIONES EN SUPABASE
  // ==========================================
  async function agregarObjetivo(nivel, parentId, periodo, titulo) {
    const { error } = await supabaseClient.from('objetivos').insert([{
      nivel, parent_id: parentId, periodo, titulo, descripcion: '', progreso: 0, hecho: false, user_id: usuarioId
    }]);
    if(error) alert('Error al guardar: ' + error.message);
    else await cargarDatos();
  }

  async function eliminarObjetivo(id) {
    if(!confirm('¿Eliminar este objetivo y sus sub-objetivos?')) return;
    const aBorrar = [id];
    let añadidos = true;
    while(añadidos) {
      añadidos = false;
      objetivos.forEach(o => {
        if (o.parent_id && aBorrar.includes(o.parent_id) && !aBorrar.includes(o.id)) {
          aBorrar.push(o.id); añadidos = true;
        }
      });
    }
    
    const { error } = await supabaseClient.from('objetivos').delete().in('id', aBorrar);
    if(error) alert('Error al borrar: ' + error.message);
    else await cargarDatos();
  }

  async function actualizarProgreso(id, nuevoProgreso) {
    const { error } = await supabaseClient.from('objetivos').update({ progreso: Number(nuevoProgreso) }).eq('id', id);
    if(!error) await cargarDatos();
  }

  async function toggleHecho(id) {
    const obj = objetivos.find(o => o.id == id);
    const nuevoEstado = !obj.hecho;
    const { error } = await supabaseClient.from('objetivos').update({ hecho: nuevoEstado, progreso: nuevoEstado ? 100 : obj.progreso }).eq('id', id);
    if(!error) await cargarDatos();
  }

  // ==========================================
  // EVENTOS DE FORMULARIOS
  // ==========================================
  document.getElementById('p-vision-save').addEventListener('click', async () => {
    const vision = document.getElementById('p-vision').value;
    const { error } = await supabaseClient.from('configuracion').upsert({ id: 1, vision, user_id: usuarioId });
    if(error) alert('Error: ' + error.message);
    else alert('Visión guardada en la nube.');
  });

  document.getElementById('form-anual').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = document.getElementById('anual-titulo').value.trim();
    const p = document.getElementById('anual-periodo').value.trim() || String(new Date().getFullYear());
    if(!t) return;
    agregarObjetivo(1, null, p, t);
    document.getElementById('anual-titulo').value = '';
  });

  document.getElementById('form-trim').addEventListener('submit', (e) => {
    e.preventDefault();
    if(!planUI.anual) return alert('Selecciona un objetivo anual.');
    const t = document.getElementById('trim-titulo').value.trim();
    const p = document.getElementById('trim-periodo').value;
    if(!t) return;
    agregarObjetivo(2, planUI.anual, p, t);
    document.getElementById('trim-titulo').value = '';
  });

  document.getElementById('form-mes').addEventListener('submit', (e) => {
    e.preventDefault();
    if(!planUI.trim) return alert('Selecciona un objetivo trimestral.');
    const t = document.getElementById('mes-titulo').value.trim();
    const p = document.getElementById('mes-periodo').value;
    if(!t) return;
    agregarObjetivo(3, planUI.trim, p, t);
    document.getElementById('mes-titulo').value = '';
  });

  document.getElementById('form-sem').addEventListener('submit', (e) => {
    e.preventDefault();
    if(!planUI.mes) return alert('Selecciona un objetivo mensual.');
    const t = document.getElementById('sem-titulo').value.trim();
    const p = document.getElementById('sem-periodo').value;
    if(!t) return;
    agregarObjetivo(4, planUI.mes, p, t);
    document.getElementById('sem-titulo').value = '';
  });

  document.getElementById('sel-anual').addEventListener('change', e => { planUI.anual = e.target.value; planUI.trim = null; planUI.mes = null; renderPlan(); });
  document.getElementById('sel-trim').addEventListener('change', e => { planUI.trim = e.target.value; planUI.mes = null; renderPlan(); });
  document.getElementById('sel-mes').addEventListener('change', e => { planUI.mes = e.target.value; renderPlan(); });

  init();
</script>
</body>
</html>
